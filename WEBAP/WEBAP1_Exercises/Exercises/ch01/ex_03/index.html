<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Exercise 1.3</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function () {
            // TODO: #greet: read #firstName and #lastName with val() and display a greeting in #output
            function clickbutton() {
                var firstName = $("#firstName").val();
                var lastName = $("#lastName").val();
                var firstName = firstName.trim();
                var lastName = lastName.trim();
                if (firstName && lastName) {
                    $("#output").text("Hello, " + firstName + " " + lastName + "!");
                    $("#message").text("").removeClass("error");
                    $("#firstName, #lastName").val("");
                } else if (!firstName) {
                    $("#message").text("Please fill in the first name as well.").addClass("error");
                    $("#firstName").focus();
                } else if (!lastName) {
                    $("#message").text("Please fill in the last name as well.").addClass("error");
                    $("#lastName").focus();
                }
            }
            $("#lastName").keyup(function (event) {
                if (event.key === "Enter") {
                    clickbutton();
                }
            });
            $("#greet").click(clickbutton());
            // TODO: error message in #message (class error) if a field is empty

            // TODO: Enter in #lastName triggers the greeting
        });
    </script>
</head>

<body>
    <h2>Exercise 1.3 – Greeting</h2>
    <p>
        <input type="text" id="firstName" placeholder="First name">
        <input type="text" id="lastName" placeholder="Last name">
        <button id="greet">Greet me</button>
    </p>
    <p id="message"></p>
    <div id="output" class="box"></div>
</body>

</html>
