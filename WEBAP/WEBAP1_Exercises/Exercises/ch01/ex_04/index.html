<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.4</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        $(document).ready(function()
        {
            function calculation (){
                var A =  parseFloat($("#a").val());
                var B =  parseFloat($("#b").val());
                var OP =  $("#op").val();
                var result;
                if (isNaN(A) || isNaN(B)) {
                    $("#result").text("Please enter valid numbers.");
                    $("#result").addClass("error");
                    return;
                }
                if (OP === "/" && B === 0) {
                    $("#result").text("Division by zero is not allowed.");
                    $("#result").addClass("error");
                    return;
                }
                switch (OP) {
                    case "+":
                        result = A + B;
                        break;
                    case "-":
                        result = A - B;
                        break;
                    case "*":
                        result = A * B;
                        break;
                    case "/":
                        result = A / B;
                        break;
                    default:
                        $("#result").text("Invalid operator.");
                        $("#result").addClass("error");
                        return;
                }
                $("#result").text(result);
                $("#result").removeClass("error");
            }

            $("#a, #b, #op").on("input change", calculation);
        });
    </script>
</head>
<body>
    <h2>Exercise 1.4 – Calculator</h2>
    <p>
        <input type="number" id="a" placeholder="Number 1">
        <select id="op">
            <option value="+">+</option>
            <option value="-">−</option>
            <option value="*">×</option>
            <option value="/">÷</option>
        </select>
        <input type="number" id="b" placeholder="Number 2">
        <span id="result" class="result"></span>
    </p>
</body>
</html>
