<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 1.1</title>
    <link rel="stylesheet" href="../../../assets/exercise.css">
    <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
    <script>
        function highlight(selector)
        {
            $(selector).css("background-color", "yellow");
        }
        function reset()
        {
            $("*").css("background-color", "");
        }
        $(document).ready(function()
        {
            // TODO: bind a click event to every button (b1 … b8)
            $("#b1").click(function(){
                reset();
                highlight("p");
            })
            $("#b2").click(function(){
                reset();
                highlight("#left");
            })
            $("#b3").click(function(){
                reset();
                highlight("#left p");
            })
            $("#b4").click(function(){
                reset();
                highlight(".special");
            })
            $("#b5").click(function(){
                reset();
                highlight("p.special");
            })
            $("#b6").click(function(){
                reset();
                highlight("div#right p.special");
            })
            $("#b7").click(function(){
                reset();
                highlight("#page p");
            })
            $("#b8").click(function(){
                reset();
                highlight("#page > p");
            })
            $("#reset").click(function(){
                reset();
            })
            // TODO: highlight the selected elements with css("background-color", "yellow")

            // TODO: #reset removes all backgrounds
        });
    </script>
</head>
<body>
    <h2>Exercise 1.1 – Selectors</h2>
    <div id="buttons">
        <button id="b1">$("p")</button>
        <button id="b2">$("#left")</button>
        <button id="b3">$("#left p")</button>
        <button id="b4">$(".special")</button>
        <button id="b5">$("p.special")</button>
        <button id="b6">$("div#right p.special")</button>
        <button id="b7">$("#page p")</button>
        <button id="b8">$("#page &gt; p")</button>
        <button id="reset">Reset</button>
    </div>

    <div id="page">
        <h1>Welcome</h1>
        <p>Hello World</p>
        <div id="left">
            <p>Paragraph A</p>
            <p class="special">Paragraph B</p>
        </div>
        <div id="right">
            <p class="special">Paragraph C</p>
            <p>Paragraph D</p>
        </div>
        <div class="special">
            <p>Paragraph E</p>
        </div>
        <p>Displayed</p>
    </div>
    
</body>
</html>
